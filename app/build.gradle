plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xowl.browser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xowl.browser'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // توقيع ثابت: يُقرأ من أسرار GitHub (متغيرات البيئة) حتى يتحدّث التطبيق فوق النسخة القديمة
    def ksFile = System.getenv("KEYSTORE_FILE")
    signingConfigs {
        ishbow {
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile != null) signingConfig signingConfigs.ishbow
        }
        release {
            minifyEnabled false
            if (ksFile != null) signingConfig signingConfigs.ishbow
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// عمداً: لا توجد أي مكتبات خارجية (لا AndroidX ولا Google Play Services ولا Firebase)
dependencies {
}
